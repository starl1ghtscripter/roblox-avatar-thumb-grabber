<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roblox Avatar Thumbnail Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      cursor: pointer;
    }

    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <h2>Roblox Avatar Thumbnail</h2>

  <label>User ID</label>
  <input type="number" id="userId" placeholder="e.g. 20867815">

  <label>Thumbnail Type</label>
  <select id="type">
    <option value="avatar-headshot">Headshot</option>
    <option value="avatar-bust">Bust</option>
    <option value="avatar">Full Body</option>
  </select>

  <label>Size</label>
  <select id="size">
    <option value="100x100">100x100</option>
    <option value="150x150">150x150</option>
    <option value="250x250">250x250</option>
    <option value="352x352">352x352</option>
    <option value="420x420">420x420</option>
    <option value="720x720">720x720</option>
  </select>

  <button onclick="loadAvatar()">Get Image</button>

  <img id="result" alt="Avatar will appear here">

  <script>
    async function loadAvatar() {
      const userId = document.getElementById("userId").value;
      const type = document.getElementById("type").value;
      const size = document.getElementById("size").value;

      if (!userId) {
        alert("Please enter a User ID");
        return;
      }

      const url = `https://thumbnails.roblox.com/v1/users/${type}?userIds=${userId}&size=${size}&format=Png&isCircular=false`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.data && data.data[0] && data.data[0].imageUrl) {
          document.getElementById("result").src = data.data[0].imageUrl;
        } else {
          alert("Thumbnail not ready yet. Try again.");
        }
      } catch (err) {
        alert("Error fetching thumbnail");
        console.error(err);
      }
    }
  </script>

</body>
</html>
